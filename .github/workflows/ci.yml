name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang libncurses-dev libmagic-dev

      - name: Compile application
        run: |
          cc -std=c2x -D_POSIX_C_SOURCE=200809L \
            -Wall -Wextra -Wpedantic -Wfatal-errors \
            -c main.c -o main.o
          cc main.o -lncursesw -lmagic -o cfl

      - name: Run unit tests
        run: |
          cc -std=c2x -D_POSIX_C_SOURCE=200809L \
            -Wall -Wextra -Wpedantic -Werror \
            tests/test_core.c -o tests/test_core
          ./tests/test_core
          cc -std=c2x -D_POSIX_C_SOURCE=200809L \
            -Wall -Wextra -Wpedantic -Wfatal-errors \
            tests/test_filesystem.c -lncursesw -lmagic -o tests/test_filesystem
          ./tests/test_filesystem

      - name: Run unit tests with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          clang -std=c2x -D_POSIX_C_SOURCE=200809L \
            -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_core.c -o tests/test_core_sanitized
          ./tests/test_core_sanitized
